<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .balance-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 5px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: var(--text-primary);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--text-secondary);
        }

        button {
            background-color: var(--text-primary);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .transaction-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .tx-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tx-note {
            font-size: 0.95rem;
        }

        .tx-category {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .tx-amount {
            font-weight: bold;
        }

        .income {
            color: var(--accent-green);
        }

        .expense {
            color: var(--accent-red);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 0 0 0 10px;
            width: auto;
        }

        .delete-btn:hover {
            color: var(--accent-red);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Money Tracker</h1>

        <!-- Balance Card -->
        <div class="card">
            <div class="balance-title">Total Balance</div>
            <div id="totalBalance" class="balance-amount">$0.00</div>
        </div>

        <!-- Add Transaction Form -->
        <div class="card">
            <form id="transactionForm">
                <input type="number" id="amount" placeholder="Amount (e.g. 50 or -20)" step="any" required>
                <input type="text" id="note" placeholder="Note (e.g. Grocery, Salary)" required>
                <select id="type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
                <button type="submit">Add Transaction</button>
            </form>
        </div>

        <!-- History Card -->
        <div class="card">
            <div class="balance-title" style="margin-bottom: 12px;">History</div>
            <ul id="transactionList" class="transaction-list">
                <!-- Transactions dynamically injected here -->
            </ul>
        </div>
    </div>

    <script>
        // Load existing transactions from localStorage or initialize empty array
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        const form = document.getElementById('transactionForm');
        const amountInput = document.getElementById('amount');
        const noteInput = document.getElementById('note');
        const typeInput = document.getElementById('type');
        const transactionList = document.getElementById('transactionList');
        const totalBalance = document.getElementById('totalBalance');

        function updateUI() {
            transactionList.innerHTML = '';
            let balance = 0;

            if (transactions.length === 0) {
                transactionList.innerHTML = '<li style="color: var(--text-secondary); text-align: center; padding: 10px 0;">No transactions yet</li>';
            }

            transactions.forEach((tx, index) => {
                const amountVal = Number(tx.amount);
                balance += amountVal;

                const li = document.createElement('li');
                li.className = 'transaction-item';

                const isIncome = tx.type === 'income' || amountVal > 0;
                const formattedAmount = `${isIncome ? '+' : ''}$${amountVal.toFixed(2)}`;

                li.innerHTML = `
                    <div class="tx-info">
                        <span class="tx-note">${escapeHtml(tx.note)}</span>
                        <span class="tx-category">${tx.type.toUpperCase()}</span>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <span class="tx-amount ${isIncome ? 'income' : 'expense'}">${formattedAmount}</span>
                        <button class="delete-btn" onclick="removeTransaction(${index})">&times;</button>
                    </div>
                `;
                transactionList.appendChild(li);
            });

            totalBalance.textContent = `$${balance.toFixed(2)}`;
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const rawAmount = parseFloat(amountInput.value);
            const type = typeInput.value;

            // Adjust sign based on dropdown choice
            const finalAmount = type === 'expense' ? -Math.abs(rawAmount) : Math.abs(rawAmount);

            const newTx = {
                amount: finalAmount,
                note: noteInput.value,
                type: type,
                date: new Date().toISOString()
            };

            transactions.unshift.apply(transactions, [newTx]); // Add to beginning of array
            form.reset();
            updateUI();
        });

        window.removeTransaction = function (index) {
            transactions.splice(index, 1);
            updateUI();
        }

        // Basic helper to prevent injection if typing weird text
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '', '"': '&quot;' }[tag] || tag)
            );
        }

        // Initial render
        updateUI();
    </script>
</body>

</html>
