<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container" id="appContainer">
        <h1>Money Tracker</h1>

        <!-- Dual Overview Balances -->
        <div class="dual-balance">
            <div class="mini-card">
                <div class="balance-title">Total Amount</div>
                <div id="totalAmountView" class="balance-amount">$0.00</div>
            </div>
            <div class="mini-card">
                <div class="balance-title">In Bank Account</div>
                <div id="bankAmountView" class="balance-amount">$0.00</div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <div class="tab-btn active" onclick="switchTab('people')">People Ledger</div>
            <div class="tab-btn" onclick="switchTab('bank')">Bank Expenses</div>
        </div>

        <!-- TAB 1: PEOPLE (PEOPLE LEDGER) -->
        <div id="peopleTab" class="tab-content active">
            <div class="card" id="peopleMainView">
                <form id="addPersonForm">
                    <input type="text" id="personName" placeholder="Person Name (e.g. Ravi)" required>
                    <button type="submit" class="action-btn">Add Person</button>
                </form>
                <div class="balance-title" style="margin-bottom: 10px;">People List</div>
                <ul id="peopleList" class="list"></ul>
            </div>

            <!-- Individual Person Detail View (Hidden by default) -->
            <div class="card" id="personDetailView" style="display: none;">
                <a class="back-link" onclick="closePersonView()">&larr; Back to People</a>
                <h3 id="detailPersonName" style="margin: 5px 0 15px 0;"></h3>
                <form id="addPersonTxForm">
                    <input type="number" id="txAmount" placeholder="Amount (e.g. 500)" step="any" required>
                    <input type="text" id="txNote" placeholder="Note (e.g. Borrowed, Lent)" required>
                    <select id="txType">
                        <option value="give">I Gave / They Owe Me (+)</option>
                        <option value="take">I Took / I Owe Them (-)</option>
                    </select>
                    <button type="submit" class="action-btn">Add Transaction</button>
                </form>
                <div class="balance-title" style="margin-bottom: 10px;">Transaction History</div>
                <ul id="personTxList" class="list"></ul>
            </div>
        </div>

        <!-- TAB 2: BANK EXPENSES -->
        <div id="bankTab" class="tab-content">
            <div class="card">
                <form id="addBankTxForm">
                    <input type="number" id="bankAmount" placeholder="Amount (e.g. 1000 for Deposit, 50 for Coffee)"
                        step="any" required>
                    <input type="text" id="bankNote" placeholder="Note (e.g. Salary, Groceries)" required>
                    <select id="bankType">
                        <option value="expense">Expense / Withdrawal (-)</option>
                        <option value="income">Income / Deposit (+)</option>
                    </select>
                    <button type="submit" class="action-btn">Add Bank Transaction</button>
                </form>
                <div class="balance-title" style="margin-bottom: 10px;">Bank Statement</div>
                <ul id="bankTxList" class="list"></ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
